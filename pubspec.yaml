name: laboursampark_app
description: "Labour Sampark - Connecting labourers and contractors seamlessly."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.17+26

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  cupertino_icons: ^1.0.8
  provider: ^6.1.2 # State management
  dio: ^5.4.0 # HTTP client with interceptor
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2 # Local storage
  hive: ^2.2.3 # Alternative local storage
  hive_flutter: ^1.1.0
  flutter_screenutil: ^5.9.0 # Responsive UI
  google_fonts: ^6.1.0 # Custom fonts
  flutter_native_splash: ^2.3.10 # Splash screen
  intl: ^0.20.2 # Internationalization
  flutter_localizations:
    sdk: flutter
  fluttertoast: ^9.0.0
  image_picker: ^1.1.2
  crypto: ^3.0.3
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  app_links: ^6.3.4
  in_app_update: ^4.2.3
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  google_mlkit_face_detection: ^0.11.0
  geolocator: ^13.0.2 # Location services
  geocoding: ^3.0.0 # Convert coordinates to address

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  firebase_crashlytics: ^4.0.0
  logger: ^2.0.2
  package_info_plus: ^8.0.0
  device_info_plus: ^9.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"


flutter_native_splash:
  color: "#2563EB"
  image: assets/images/app_logo.png
  android: true
  ios: true
  web: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/app_logo_dark.png
    - assets/images/profile_frame.png
    - assets/images/account/
    - assets/logo.jpg
    - assets/icon.png
    - assets/dark-logo.png
    - assets/labourimg.jpg
    - assets/labourcontractor.jpg
    - assets/heroimg.jpg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
